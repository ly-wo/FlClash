name: Android

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.41.9
  GO_VERSION: 1.22.10
  NDK_VERSION: r28c

jobs:
  checks:
    name: Tests and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check pinned submodules
        run: |
          test -f core/Clash.Meta/go.mod
          test -f plugins/tray_manager/packages/tray_manager/pubspec.yaml
          git submodule status --recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Analyze and test the Android core build tool
        working-directory: plugins/setup/buildkit/build_tool
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test --reporter expanded

  android:
    name: Build Android APKs and core libraries
    needs: checks
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check pinned submodules
        run: |
          test -f core/Clash.Meta/go.mod
          test -f plugins/tray_manager/packages/tray_manager/pubspec.yaml
          git submodule status --recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            core/Clash.Meta/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Export Android NDK
        run: |
          ndk="${{ steps.ndk.outputs.ndk-path }}"
          test -n "$ndk"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          echo "ANDROID_NDK=${ndk}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ndk}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ndk}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Build installable APKs for all ABIs
        env:
          APP_ENV: stable
        run: |
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64 \
            --dart-define=APP_ENV=stable

      - name: Package core libraries and checksums
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stage="$(mktemp -d)"
          root="${stage}/flclash-android-core"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            so="libclash/android/${abi}/libclash.so"
            header_dir="android/core/src/main/cpp/includes/${abi}"
            test -f "${so}"
            test -f "${header_dir}/libclash.h"
            test -f "${header_dir}/bride.h"
            mkdir -p "${root}/jniLibs/${abi}" "${root}/includes/${abi}"
            cp "${so}" "${root}/jniLibs/${abi}/libclash.so"
            cp "${header_dir}/libclash.h" "${header_dir}/bride.h" "${root}/includes/${abi}/"
          done
          mkdir -p dist
          (
            cd "${stage}"
            zip -r "${GITHUB_WORKSPACE}/dist/flclash-android-core-${version}.zip" flclash-android-core
          )
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/FlClash-${version}-android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/FlClash-${version}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/FlClash-${version}-android-x86_64.apk"
          python3 -c 'import pathlib,zipfile; dist=pathlib.Path("dist"); expected={"android-armeabi-v7a.apk":"lib/armeabi-v7a/libclash.so","android-arm64-v8a.apk":"lib/arm64-v8a/libclash.so","android-x86_64.apk":"lib/x86_64/libclash.so"}; found={};[(found.__setitem__(key,[name for name in zipfile.ZipFile(apk).namelist() if name==library])) for apk in dist.glob("*.apk") for key,library in expected.items() if apk.name.endswith(key)]; missing=[key for key,names in found.items() if len(names)!=1]; assert not missing and len(found)==3, found'
          (
            cd dist
            sha256sum -- *.apk *.zip > SHA256SUMS
          )
          test "$(wc -l < dist/SHA256SUMS)" -eq 4

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            这是本 fork 的 Android 标签构建，包含三个 ABI 的可安装 APK、核心库 zip 和 SHA256SUMS。

            没有配置正式签名密钥。APK 使用 Android debug 签名，应用 ID 带 `.dev` 后缀，包名是 `com.follow.clash.dev`。这不是稳定的发布签名。

            本流程不向 Telegram、F-Droid 或 Firebase 上传产物。`google-services.json` 存在时应用内仍可初始化 Crashlytics；映射和符号默认不上传。
