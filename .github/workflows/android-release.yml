name: Android

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  checks:
    name: Tests and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check pinned submodules
        run: |
          test -f core/Clash.Meta/go.mod
          test -f core/shanlian/manifest.json
          git submodule status --recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Analyze and test the core setup hooks
        working-directory: plugins/setup/setup_hooks
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test --reporter expanded

  android:
    name: Build Android APKs and core libraries
    needs: checks
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check pinned submodules
        run: |
          test -f core/Clash.Meta/go.mod
          test -f core/shanlian/manifest.json
          git submodule status --recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            core/Clash.Meta/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Export Android NDK
        run: |
          ndk="${{ steps.ndk.outputs.ndk-path }}"
          test -n "$ndk"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          echo "ANDROID_NDK=${ndk}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ndk}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ndk}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Build installable APKs for all ABIs
        env:
          APP_ENV: stable
        run: |
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64 \
            --dart-define=APP_ENV=stable

      - name: Package core libraries and checksums
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stage="$(mktemp -d)"
          root="${stage}/flclash-android-core"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/FlClash-${version}-android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/FlClash-${version}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/FlClash-${version}-android-x86_64.apk"
          STAGE="$stage" python3 -c 'import os,pathlib,zipfile; dist=pathlib.Path("dist"); root=pathlib.Path(os.environ["STAGE"])/"flclash-android-core"; expected={"android-armeabi-v7a.apk":("armeabi-v7a","lib/armeabi-v7a/libclash.so"),"android-arm64-v8a.apk":("arm64-v8a","lib/arm64-v8a/libclash.so"),"android-x86_64.apk":("x86_64","lib/x86_64/libclash.so")}; found=set();
[(dest.mkdir(parents=True, exist_ok=True), (dest/"libclash.so").write_bytes(zipfile.ZipFile(apk).read(library)), found.add(abi)) for apk in dist.glob("*.apk") for key,(abi,library) in expected.items() if apk.name.endswith(key) for dest in [root/"jniLibs"/abi]];
assert found=={"armeabi-v7a","arm64-v8a","x86_64"}, found; data=(root/"jniLibs"/"arm64-v8a"/"libclash.so").read_bytes(); assert b"shanlian" in data, "arm64 libclash.so is missing the shanlian version marker"'
          (
            cd "${stage}"
            zip -r "${GITHUB_WORKSPACE}/dist/flclash-android-core-${version}.zip" flclash-android-core
          )
          (
            cd dist
            sha256sum -- *.apk *.zip > SHA256SUMS
          )
          test "$(wc -l < dist/SHA256SUMS)" -eq 4

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            这是本 fork 的 Android 标签构建，包含三个 ABI 的可安装 APK、核心库 zip 和 SHA256SUMS。

            没有配置正式签名密钥。APK 使用 Android debug 签名，应用 ID 带 `.dev` 后缀，包名是 `com.follow.clash.dev`。这不是稳定的发布签名。

            本流程不向 Telegram 或 F-Droid 上传产物。Android 核心是打过闪连 AnyTLS 认证补丁的 Mihomo，库名是 libclash.so。
